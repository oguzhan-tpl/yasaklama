name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q controller.py tests
      - name: Test self-signed TLS certificate generation
        run: |
          python scripts/create_lan_cert.py --ip 192.0.2.50 --output-dir /tmp/yasaklama-cert-test
          python scripts/create_lan_cert.py --ip 192.0.2.51 --output-dir /tmp/yasaklama-cert-test
      - name: Run tests
        run: python -m pytest -q
